[package]
name = "sitos"
version = "0.1.0"
description = "Stock, menus et recettes : la cuisine d'un mois, en local."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sitos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
